name: Bot Core Test

on:
  workflow_dispatch:
  push:
    branches:
      - refactor-architecture

jobs:
  test-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check bot syntax
        env:
          BOT_TOKEN: test_token
        run: python -m py_compile bot.py

      - name: Check bot imports
        env:
          BOT_TOKEN: test_token
        run: python -c "from bot import build_application; print('BOT CORE IMPORT PASSED')"

      - name: Run utility tests
        run: python test_utils.py

      - name: Run quiz tests
        run: python test_quiz.py
