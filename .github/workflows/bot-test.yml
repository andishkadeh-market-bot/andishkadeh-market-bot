name: Bot Core Test

on:
  workflow_dispatch:
  push:
    branches:
      - refactor-architecture

jobs:
  test-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check bot syntax
        env:
          BOT_TOKEN: test_token
        run: python -m py_compile bot.py

      - name: Check bot imports
        env:
          BOT_TOKEN: test_token
        run: python -c "from bot import build_application; print('BOT CORE IMPORT PASSED')"

      - name: Run utility tests
        run: python test_utils.py

      - name: Run quiz tests
        run: python test_quiz.py

      - name: Run management quiz integration test
        run: python test_management_quiz.py

      - name: Run management module test
        run: python test_management_module.py

      - name: Run management router test
        run: python test_management_router.py

      - name: Run lesson 02 test
        run: python test_lesson_02.py

      - name: Run lesson handler test
        run: python test_lesson_handler.py

      - name: Run lesson 02 quiz test
        run: python test_management_lesson_02_quiz.py

      - name: Run lesson 02 quiz flow test
        run: python test_management_lesson_02_quiz_flow.py

      - name: Run lesson 03 test
        run: python test_lesson_03.py
